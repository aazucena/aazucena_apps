# ==============================================================================
# Docker Compose Configuration for LOCAL DEVELOPMENT ONLY
# ==============================================================================
# This file is configured for local development with default credentials.
# For production deployment, use Railway or other cloud services with
# proper environment variables set.
#
# Security Notes:
# - Default credentials are ONLY for local development
# - Set strong passwords in .env for production
# - Never commit .env with production credentials
# ==============================================================================

services:
  plausible-db:
    container_name: aazucena-plausible-db
    image: postgres:16-alpine
    restart: always
    volumes:
      - plausible-postgres-data:/var/lib/postgresql/data
    environment:
      - POSTGRES_PASSWORD=${PLAUSIBLE_DATABASE_PASSWORD:-plausible}
    networks:
      - plausible-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      start_period: 1m

  plausible-clickhouse:
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    container_name: aazucena-plausible-clickhouse
    image: clickhouse/clickhouse-server:24.12-alpine
    restart: always
    volumes:
      - plausible-clickhouse-data:/var/lib/clickhouse
      - plausible-clickhouse-logs:/var/log/clickhouse-server
      - ./logs.xml:/etc/clickhouse-server/config.d/logs.xml:ro
      # This makes ClickHouse bind to IPv4 only, since Docker doesn't enable IPv6 in bridge networks by default.
      # Fixes "Listen [::]:9000 failed: Address family for hostname not supported" warnings.
      - ./ipv4-only.xml:/etc/clickhouse-server/config.d/ipv4-only.xml:ro
      # The following configuration files make ClickHouse consume less resources, which is useful for small setups.
      # https://clickhouse.com/docs/en/operations/tips#using-less-than-16gb-of-ram
      - ./low-resources.xml:/etc/clickhouse-server/config.d/low-resources.xml:ro
      - ./default-profile-low-resources-overrides.xml:/etc/clickhouse-server/users.d/default-profile-low-resources-overrides.xml:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    networks:
      - plausible-network
    environment:
      - CLICKHOUSE_SKIP_USER_SETUP=1
      - CLICKHOUSE_USER=${PLAUSIBLE_CLICKHOUSE_USER:-default}
      - CLICKHOUSE_DB=${PLAUSIBLE_CLICKHOUSE_DB:-plausible_events_db}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --no-verbose --tries=1 -O - http://127.0.0.1:8123/ping || exit 1",
        ]
      start_period: 1m

  plausible:
    container_name: aazucena-plausible
    image: ghcr.io/plausible/community-edition:v3.2.0
    restart: always
    command: sh -c "/entrypoint.sh db createdb && /entrypoint.sh db migrate && /entrypoint.sh run"
    ports:
      - "8000:8000"
    depends_on:
      plausible-db:
        condition: service_healthy
      plausible-clickhouse:
        condition: service_healthy
    volumes:
      - plausible-data:/var/lib/plausible
    networks:
      - plausible-network
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    environment:
      - TMPDIR=/var/lib/plausible/tmp
      # required: https://github.com/plausible/community-edition/wiki/configuration#required
      - BASE_URL=${PLAUSIBLE_BASE_URL:-http://localhost:8000}
      - SECRET_KEY_BASE=${PLAUSIBLE_SECRET_KEY_BASE:-NjZdsV53VV6NedjSIXyVMscHe2pfnm+ng2bMi4IBjsG7Kt1dguX8Hnc/1LXt6KDD}
      # optional: https://github.com/plausible/community-edition/wiki/configuration#optional
      # registration: https://github.com/plausible/community-edition/wiki/configuration#registration
      - TOTP_VAULT_KEY
      - DISABLE_REGISTRATION
      - ENABLE_EMAIL_VERIFICATION
      # web: https://github.com/plausible/community-edition/wiki/configuration#web
      - HTTP_PORT
      - HTTPS_PORT
      # databases: https://github.com/plausible/community-edition/wiki/configuration#database
      - DATABASE_URL=postgres://postgres:${PLAUSIBLE_DATABASE_PASSWORD:-plausible}@plausible-db:5432/plausible_db
      - CLICKHOUSE_DATABASE_URL=http://plausible-clickhouse:8123/plausible_events_db
      # Google: https://github.com/plausible/community-edition/wiki/configuration#google
      - GOOGLE_CLIENT_ID
      - GOOGLE_CLIENT_SECRET
      # geolocation: https://github.com/plausible/community-edition/wiki/configuration#ip-geolocation
      - IP_GEOLOCATION_DB
      - GEONAMES_SOURCE_FILE
      - MAXMIND_LICENSE_KEY
      - MAXMIND_EDITION
      # email: https://github.com/plausible/community-edition/wiki/configuration#email
      - MAILER_ADAPTER
      - MAILER_EMAIL
      - MAILER_NAME
      - SMTP_HOST_ADDR
      - SMTP_HOST_PORT
      - SMTP_USER_NAME
      - SMTP_USER_PWD
      - SMTP_HOST_SSL_ENABLED
      - POSTMARK_API_KEY
      - MAILGUN_API_KEY
      - MAILGUN_DOMAIN
      - MAILGUN_BASE_URI
      - MANDRILL_API_KEY
      - SENDGRID_API_KEY
      
volumes:
  plausible-postgres-data:
    driver: local
  plausible-clickhouse-data:
    driver: local
  plausible-clickhouse-logs:
    driver: local
  plausible-data:
    driver: local

networks:
  plausible-network:
    driver: bridge
