services:
  intel-bridge:
    container_name: aazucena-intel-bridge
    image: aazucena/intel-bridge:latest
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3002:3001"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - PYTHONUNBUFFERED=1
      - INTERNAL_INGEST_URL=http://host.docker.internal:8080/api/ingest
      - STRAPI_URL=http://aazucena-cms:1337
    restart: unless-stopped
