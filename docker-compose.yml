services:
  strapi:
    container_name: aazucena-cms
    build:
      context: .
      dockerfile: apps/cms/Dockerfile
    ports:
      - "1337:1337"
      - "5173:5173"  # Vite dev server for admin panel
    volumes:
      - ./apps/cms:/srv/app
      - /srv/app/node_modules
      - /srv/app/.cache
    env_file: ./apps/cms/.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - aazucena-network
    restart: unless-stopped

  postgres:
    container_name: aazucena-db
    image: pgvector/pgvector:pg16
    platform: linux/amd64 #for platform error on Apple M1 chips
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: strapi
      POSTGRES_USER: strapi
      POSTGRES_PASSWORD: strapi
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./apps/cms/database/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - aazucena-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U strapi -d strapi"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    container_name: aazucena-redis
    image: bitnami/redis:latest
    ports:
      - "6379:6379"
    environment:
      - ALLOW_EMPTY_PASSWORD=yes
      # For production, use: REDIS_PASSWORD=your_secure_password
    volumes:
      - redis-data:/bitnami/redis/data
    networks:
      - aazucena-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres-data:
    driver: local
  redis-data:
    driver: local

networks:
  aazucena-network:
    driver: bridge
