services:
  database:
    container_name: ${POSTGRES_CONTAINER}
    image: postgis/postgis:${POSTGRES_VERSION}
    # Required when running on platform other than amd64, like Apple M1/M2:
    # platform: linux/amd64
    volumes:
      - ./.local/data:/var/lib/postgresql/data
      - db_data:/var/lib/postgresql/data
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    healthcheck:
      test: ["CMD", "pg_isready", "--host=localhost", "--username=${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_interval: 5s
      start_period: 30s
    networks:
      - directus

  cache:
    container_name: ${CACHE_CONTAINER}
    image: redis:6
    healthcheck:
      test: ["CMD-SHELL", "[ $$(redis-cli ping) = 'PONG' ]"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_interval: 5s
      start_period: 30s
    networks:
      - directus

  directus:
    container_name: ${DIRECTUS_CONTAINER}
    pull_policy: always
    image: directus/directus:${DIRECTUS_VERSION}
    restart: unless-stopped
    ports:
      - 8055:8055
    volumes:
      - ./.local/uploads:/directus/uploads
      - ./extensions/.registry:/directus/extensions/.registry
      - ../../packages/directus/extensions:/directus/extensions
      
    depends_on:
      database:
        condition: service_healthy
      cache:
        condition: service_healthy
    environment:
      SECRET: ${DIRECTUS_SECRET}

      DB_CLIENT: ${DB_CLIENT}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_DATABASE: ${DB_DATABASE}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}

      CACHE_ENABLED: ${CACHE_ENABLED}
      CACHE_AUTO_PURGE: ${CACHE_AUTO_PURGE}
      CACHE_STORE: ${CACHE_STORE}
      REDIS: ${REDIS}

      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ACCESS_TOKEN_TTL: ${ACCESS_TOKEN_TTL}

      EXTENSIONS_AUTO_RELOAD: ${EXTENSIONS_AUTO_RELOAD}
      CHOKIDAR_USEPOLLING: true

      WEBSOCKETS_ENABLED: ${WEBSOCKETS_ENABLED}

      MARKETPLACE_TRUST: "all"

      CORS_ENABLED: ${CORS_ENABLED}
      CORS_ORIGIN: ${CORS_ORIGIN}
      CORS_METHODS: ${CORS_METHODS}
    networks:
      - directus
    env_file:
      - .env.directus

      
volumes:
  db_data:

networks:
  directus: