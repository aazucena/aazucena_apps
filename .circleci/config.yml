version: 2.1

orbs:
  node: circleci/node@6.1.0

jobs:
  validate_and_test: # Combined to save overhead
    executor:
      name: node/default
      tag: "20.11.1"
    environment:
      HSKY: "0" # This works for all steps in the job, including the Orb
    steps:
      - checkout
      - node/install-packages:
          pkg-manager: pnpm
          with-cache: true
          # This allows pnpm to sync the overrides without failing the build
          check-cache: false
          extra-args: "--no-frozen-lockfile"
      - run:
          name: "List Workspace Projects"
          command: pnpm list -r --depth -1
      - run:
          name: "Verify Commit Messages"
          command: |
            if [ -n "$CIRCLE_PR_NUMBER" ]; then
              npx commitlint --from=main --to=HEAD
            fi
      - run:
          name: "Lint, Format & Type-Check"
          # Run parallelizable tasks together
          command: pnpm turbo lint format type-check build
      - run:
          name: "Verify Changesets"
          command: npx changeset status

workflows:
  quality_gate:
    jobs:
      - validate_and_test